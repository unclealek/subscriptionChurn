name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  dbt-and-terraform-validation:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: profiles
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_CATALOG: ${{ vars.DBT_CATALOG || 'transform' }}
      DBT_SCHEMA: ${{ vars.DBT_SCHEMA || 'dbt_silver' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python and dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Prepare dbt profile
        run: cp profiles/profiles.yml.example profiles/profiles.yml

      - name: Parse dbt project
        run: dbt parse --target dev

      - name: Compile dbt project
        run: dbt compile --target dev

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.1"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
